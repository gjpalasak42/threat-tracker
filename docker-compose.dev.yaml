services:
  db:
    image: postgres:16-alpine
    container_name: threat-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threat_pass}
      POSTGRES_DB: ${POSTGRES_DB:-threat_tracker}
    ports:
      - "5432:5432"
    volumes:
      # Use local directory for persistent data across restarts
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threat_user} -d ${POSTGRES_DB:-threat_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Security: Run as non-root user (postgres user in alpine)
    user: postgres
    # Security: Limit container capabilities
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # Security: Read-only root filesystem where possible
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: threat-tracker-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-threat_user}:${POSTGRES_PASSWORD:-threat_pass}@db:5432/${POSTGRES_DB:-threat_tracker}
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_SECRET: ${AUTH_SECRET:-dev_secret_change_in_production}
      CRON_SECRET: ${CRON_SECRET:-dev_cron_secret_change_in_production}
      AUTH_TRUST_HOST: "true"
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source for hot reloading in development
      - .:/app:cached
      # Use named volumes instead of anonymous to prevent orphaned volumes
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    # Security: Limit container capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - internal

networks:
  internal:
    driver: bridge

# Named volumes prevent orphaned volumes on rebuild
volumes:
  app_node_modules:
  app_next:
