# Threat Sync Cron Job
# 
# Runs twice daily to sync threats from AbuseIPDB blacklist.
# Respects the 2x/day rate limit for the free tier.

name: Threat Sync

on:
  schedule:
    # Run at 6:00 AM and 6:00 PM UTC (twice daily)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Allow manual trigger

env:
  APP_URL: ${{ secrets.APP_URL }}

jobs:
  sync:
    name: Sync Threats from AbuseIPDB
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Sync Endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${APP_URL}/api/sync")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Sync failed with status $http_code"
            exit 1
          fi
          
          echo "Sync completed successfully"
