# Threat Sync Cron Jobs
# 
# Runs scheduled syncs for threat intelligence sources:
# - AbuseIPDB: Twice daily (respects 2x/day free tier limit)
# - AlienVault OTX: Every 4 hours (respects 10,000/hr rate limit)

name: Threat Sync

on:
  schedule:
    # AbuseIPDB: Run at 6:00 AM and 6:00 PM UTC (twice daily)
    - cron: '0 6,18 * * *'
    # OTX: Run every 4 hours (0:00, 4:00, 8:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      source:
        description: 'Sync source to trigger'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - abuseipdb
          - otx

env:
  APP_URL: ${{ secrets.APP_URL }}

jobs:
  sync-abuseipdb:
    name: Sync from AbuseIPDB
    runs-on: ubuntu-latest
    # Run on the 6 AM/6 PM schedule or when manually triggered with 'both' or 'abuseipdb'
    if: |
      github.event.schedule == '0 6,18 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.source == 'both' || github.event.inputs.source == 'abuseipdb'))
    
    steps:
      - name: Trigger AbuseIPDB Sync Endpoint
        run: |
          echo "Starting AbuseIPDB sync..."
          
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${APP_URL}/api/sync")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "AbuseIPDB sync failed with status $http_code"
            exit 1
          fi
          
          echo "AbuseIPDB sync completed successfully"

  sync-otx:
    name: Sync from AlienVault OTX
    runs-on: ubuntu-latest
    # Run on the 4-hour schedule or when manually triggered with 'both' or 'otx'
    if: |
      github.event.schedule == '0 0,4,8,12,16,20 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.source == 'both' || github.event.inputs.source == 'otx'))
    
    steps:
      - name: Trigger OTX Sync Endpoint
        run: |
          echo "Starting AlienVault OTX sync..."
          
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${APP_URL}/api/sync/otx")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "OTX sync failed with status $http_code"
            exit 1
          fi
          
          echo "OTX sync completed successfully"
